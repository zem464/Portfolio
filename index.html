<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris - Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {font-family:'Space Grotesk', sans-serif;}
        .font-mono {font-family:'Space Mono', monospace;}
        .glow {position:absolute; width:480px; height:480px; border-radius:50%; filter:blur(110px); opacity:.35; z-index:0; pointer-events:none;}
        .glow-1 {background:#8b7cf6; top:-120px; left:-100px;}
        .glow-2 {background:#ff7a59; top:60px; right:-140px;}
        .gradient-text {background:linear-gradient(135deg,#8b7cf6,#ff7a59); -webkit-background-clip:text; background-clip:text; color:transparent;}
        .avatar-badge {width:84px; height:84px; border-radius:50%; background:linear-gradient(135deg,#8b7cf6,#ff7a59); display:flex; align-items:center; justify-content:center; font-family:'Space Mono',monospace; font-weight:700; font-size:22px;}
        .thumb-gradient {height:150px; background:linear-gradient(135deg,#8b7cf6,#ff7a59); opacity:.85; border-radius: var(--bs-card-inner-border-radius) var(--bs-card-inner-border-radius) 0 0;}
        .hover-lift {transition: transform .2s;}
        .hover-lift:hover {transform: translateY(-4px);}
        .blur-nav {background: rgba(10,10,16,.7); backdrop-filter: blur(10px);}
    </style>
</head>
<body>

</body>
</html>
