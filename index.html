<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris - Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {font-family:'Space Grotesk', sans-serif;}
        .font-mono {font-family:'Space Mono', monospace;}
        .glow {position:absolute; width:480px; height:480px; border-radius:50%; filter:blur(110px); opacity:.35; z-index:0; pointer-events:none;}
        .glow-1 {background:#8b7cf6; top:-120px; left:-100px;}
        .glow-2 {background:#ff7a59; top:60px; right:-140px;}
        .gradient-text {background:linear-gradient(135deg,#8b7cf6,#ff7a59); -webkit-background-clip:text; background-clip:text; color:transparent;}
        .avatar-badge {width:84px; height:84px; border-radius:50%; background:linear-gradient(135deg,#8b7cf6,#ff7a59); display:flex; align-items:center; justify-content:center; font-family:'Space Mono',monospace; font-weight:700; font-size:22px;}
        .thumb-gradient {height:150px; background:linear-gradient(135deg,#8b7cf6,#ff7a59); opacity:.85; border-radius: var(--bs-card-inner-border-radius) var(--bs-card-inner-border-radius) 0 0;}
        .hover-lift {transition: transform .2s;}
        .hover-lift:hover {transform: translateY(-4px);}
        .blur-nav {background: rgba(10,10,16,.7); backdrop-filter: blur(10px);}
    </style>
</head>
<body>
    <!-- Navigation bar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top blur-nav border-bottom border-secondary-subtle">
        <div class="container-fluid" style="margin-left: 20px;">
            <a class="navbar-brand fw-bold" href="#">Iris<span style="color:#ff7a59">.</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="nav">
                <ul class="navbar-nav gap-3">
                    <li class="nav-item"><a class="nav-link" href="#work">Work</a></li>
                    <li class="nav-item"><a class="nav-link" href="#stack">Stack</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Header section -->
    <header class="position-relative text-center pt-5 mt-5 pb-4 mb-10 overflow-hidden">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        <div class="container position-relative" style="max-width:640px;">
            <div class="avatar-badge mx-auto mb-4">&lt;/&gt;</div>
            <p class="font-mono text-uppercase text-secondary small mb-3" style="letter-spacing:.15em;">Computer engineering grad</p>
            <h1 class="fw-bold mb-3" style="font-size:clamp(28px,5vw,44px);">I want to build things — <span class="gradient-text">and I'm just getting started.</span></h1>
            <p class="text-secondary mb-4">Turning a Python background into full-stack skills, one project at a time. This site is project #1.</p>
            <div class="d-flex gap-3 justify-content-center flex-wrap">
                <a href="#work" class="btn btn-light rounded-pill px-4">View my work</a>
                <a href="#contact" class="btn btn-outline-light rounded-pill px-4">Download résumé</a>
            </div>
        </div>
    </header>
</body>
</html>
